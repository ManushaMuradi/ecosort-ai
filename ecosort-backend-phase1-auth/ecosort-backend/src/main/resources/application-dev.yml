spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    show-sql: true

logging:
  level:
    com.ecosort: DEBUG
    org.hibernate.SQL: DEBUG

ecosort:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-this-is-not-for-production-use-32bytes-min}
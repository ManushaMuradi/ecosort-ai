version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecosort-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecosort
      POSTGRES_USER: ecosort_user
      POSTGRES_PASSWORD: ecosort_pass
    ports:
      - "5432:5432"
    volumes:
      - ecosort_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecosort_user -d ecosort"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ecosort_pgdata:

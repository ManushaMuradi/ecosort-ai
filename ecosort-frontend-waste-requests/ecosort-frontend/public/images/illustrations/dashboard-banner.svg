<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of people sorting recyclable waste outdoors">
  <rect width="1200" height="320" fill="#0F6E3D"/>
  <rect width="1200" height="320" fill="url(#skyFade)"/>
  <defs>
    <linearGradient id="skyFade" x1="0" y1="0" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#178A4C"/>
      <stop offset="1" stop-color="#22A35F"/>
    </linearGradient>
  </defs>

  <!-- sun -->
  <circle cx="1080" cy="70" r="46" fill="#FDE68A" opacity="0.9"/>

  <!-- clouds -->
  <g opacity="0.5" fill="#F0FDF6">
    <ellipse cx="180" cy="60" rx="46" ry="20"/>
    <ellipse cx="220" cy="50" rx="34" ry="16"/>
    <ellipse cx="620" cy="46" rx="40" ry="18"/>
  </g>

  <!-- hills -->
  <path d="M0 240 C160 190 320 260 520 220 C700 186 860 250 1040 210 C1120 194 1170 210 1200 220 L1200 320 L0 320Z" fill="#0F6E3D"/>
  <path d="M0 270 C200 232 380 288 600 256 C800 228 960 280 1200 250 L1200 320 L0 320Z" fill="#0B5A32"/>

  <!-- bins -->
  <g>
    <rect x="560" y="216" width="52" height="58" rx="6" fill="#F0FDF6"/>
    <rect x="553" y="204" width="66" height="15" rx="6" fill="#DCFCE9"/>
    <path d="M586 232 L586 254 M577 243 L595 243" stroke="#178A4C" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="626" y="222" width="52" height="52" rx="6" fill="#60A5FA"/>
    <rect x="619" y="210" width="66" height="15" rx="6" fill="#93C5FD"/>
  </g>
  <g>
    <rect x="494" y="226" width="52" height="48" rx="6" fill="#FBBF24"/>
    <rect x="487" y="214" width="66" height="15" rx="6" fill="#FDE68A"/>
  </g>

  <!-- person 1: carrying a bottle toward bins -->
  <g>
    <path d="M420 274 C420 232 438 206 470 202 C476 236 470 262 448 274Z" fill="#DCFCE9"/>
    <circle cx="452" cy="188" r="20" fill="#E8B589"/>
    <path d="M432 184 C432 168 444 160 454 160 C466 160 476 170 474 182 C462 176 440 174 432 184Z" fill="#18181B"/>
    <path d="M470 210 C486 202 498 206 506 218" stroke="#E8B589" stroke-width="10" stroke-linecap="round"/>
    <rect x="500" y="208" width="16" height="26" rx="4" fill="#60A5FA"/>
  </g>

  <!-- person 2: bending to place item -->
  <g>
    <path d="M700 274 C700 240 682 214 654 210 C646 244 654 266 674 274Z" fill="#BBF7D0"/>
    <circle cx="666" cy="196" r="19" fill="#E8B589"/>
    <path d="M648 194 C646 180 656 172 666 172 C678 172 688 182 686 194 C674 188 654 186 648 194Z" fill="#3F3F46"/>
    <path d="M654 216 C640 224 630 236 628 248" stroke="#E8B589" stroke-width="10" stroke-linecap="round"/>
    <rect x="614" y="244" width="20" height="14" rx="4" fill="#178A4C"/>
  </g>

  <!-- floating leaves -->
  <path d="M300 120 C292 112 292 100 302 94 C310 102 310 114 300 120Z" fill="#BBF7D0" opacity="0.8"/>
  <path d="M940 150 C930 142 930 128 942 120 C952 130 952 144 940 150Z" fill="#DCFCE9" opacity="0.8"/>

  <!-- small tree -->
  <g>
    <rect x="150" y="240" width="10" height="34" fill="#0B5A32"/>
    <circle cx="155" cy="228" r="26" fill="#22A35F"/>
    <circle cx="135" cy="240" r="18" fill="#178A4C"/>
    <circle cx="176" cy="240" r="18" fill="#178A4C"/>
  </g>
  <g>
    <rect x="1000" y="250" width="8" height="26" fill="#0B5A32"/>
    <circle cx="1004" cy="240" r="20" fill="#22A35F"/>
  </g>
</svg>
